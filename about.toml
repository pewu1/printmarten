# Policy for the reviewed GPLv3 application. Font data retains its own license.
# See docs/license-audit.md; this allowlist is not a compatibility proof by itself.
accepted = [
    "GPL-3.0-only",
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "BSL-1.0", "CC0-1.0", "Unicode-3.0",
]

# These grants apply to independently licensed font data in this crate only.
# They must not make a future code dependency under a font license acceptable.
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]
